spring:
  datasource:
    url: jdbc:h2:mem:aiworkbench-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: wp1TestJwtSecretKeyValueMustBeAtLeast256BitsLongForHmacSha256!!
  expiration: 3600000

logging:
  level:
    com.aiworkbench: INFO
    org.hibernate.SQL: INFO
