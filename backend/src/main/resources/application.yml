server:
  port: 8080

spring:
  application:
    name: ai-workbench-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_workbench}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

jwt:
  secret: ${JWT_SECRET:aiWorkbench2026SecretKeyForJwtTokenSigningMustBe256BitsLongEnoughForHmacSha}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.aiworkbench: DEBUG
    org.hibernate.SQL: DEBUG
